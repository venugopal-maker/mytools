<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Converter: Video to Images &amp; PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Video Converter</h1>
<p class="sub">Turn any video into images or a PDF. Everything runs in your browser, so your video is never uploaded.</p>

<div class="card">
  <div class="drop" id="drop"><b>Choose or drop a video here</b><span class="info">MP4, WebM, MOV and other formats your browser can play</span></div>
  <input type="file" id="file" accept="video/*" hidden>
  <video id="vid" controls muted playsinline></video>
  <div class="info" id="info"></div>
</div>

<div class="card">
  <div class="grid">
    <div><label for="engine">Speed mode</label><select id="engine"><option value="fast">Fast (plays the video quickly)</option><option value="exact">Exact seek (slower)</option></select></div>
    <div><label for="rate">Playback speed (fast mode)</label><select id="rate"><option value="2">2x (most accurate)</option><option value="4" selected>4x</option><option value="8">8x</option><option value="16">16x (fastest)</option></select></div>
    <div><label for="mode">Capture mode</label><select id="mode" onchange="if(this.value==='smart'&&$('step').value==='1')$('step').value='0.5'"><option value="interval">Every few seconds</option><option value="smart">Only when something changes</option></select></div>
    <div><label for="sens">Change sensitivity (smart mode)</label><select id="sens"><option value="1">Maximum (typing, small text changes)</option><option value="4">High (small movement)</option><option value="8" selected>Medium</option><option value="16">Low (big changes only)</option></select></div>
    <div><label for="step">Check / capture every (seconds)</label><input type="number" id="step" value="1" min="0.01" step="0.01"></div>
    <div><label for="fmt">Image format</label><select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option></select></div>
    <div><label for="size">Image size</label><select id="size"><option value="0">Original</option><option value="1280">Max 1280 px wide</option><option value="720">Max 720 px wide</option></select></div>
    <div><label for="max">Maximum images</label><input type="number" id="max" value="10000" min="1" max="100000"></div>
  </div>
  <div class="row"><button id="go" disabled>Extract frames</button><button class="sec" id="stop" disabled>Stop</button></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card" id="out" style="display:none">
  <strong id="count"></strong>
  <div class="row"><button id="zip">Download images (ZIP)</button><button class="sec" id="pdf">Download PDF</button></div>
  <div class="thumbs" id="thumbs"></div>
</div>
</main>

<script src="script.js"></script>
</body>
</html>
